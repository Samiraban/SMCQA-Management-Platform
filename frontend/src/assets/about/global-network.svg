    <circle cx="420" cy="150" r="3"/><circle cx="460" cy="120" r="3"/><circle cx="500" cy="160" r="3"/>
    <circle cx="540" cy="110" r="3"/><circle cx="580" cy="140" r="3"/><circle cx="620" cy="100" r="3"/>

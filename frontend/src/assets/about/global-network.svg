    <circle cx="730" cy="280" r="3"/><circle cx="780" cy="310" r="3"/><circle cx="830" cy="270" r="3"/>
    <circle cx="880" cy="320" r="3"/><circle cx="930" cy="290" r="3"/><circle cx="980" cy="330" r="3"/>

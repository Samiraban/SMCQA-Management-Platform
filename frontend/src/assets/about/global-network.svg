    <circle cx="900" cy="180" r="3"/><circle cx="940" cy="140" r="3"/><circle cx="980" cy="100" r="3"/>
    <circle cx="1020" cy="160" r="3"/><circle cx="1060" cy="120" r="3"/><circle cx="1100" cy="150" r="3"/>
    <circle cx="1140" cy="100" r="3"/><circle cx="1180" cy="170" r="3"/><circle cx="1220" cy="130" r="3"/>
    <circle cx="1260" cy="160" r="3"/><circle cx="1300" cy="110" r="3"/><circle cx="1340" cy="150" r="3"/>
    <circle cx="1380" cy="120" r="3"/><circle cx="1420" cy="180" r="3"/><circle cx="1460" cy="140" r="3"/>
    <circle cx="1500" cy="100" r="3"/><circle cx="1540" cy="160" r="3"/>

    <circle cx="130" cy="280" r="3"/><circle cx="180" cy="310" r="3"/><circle cx="230" cy="270" r="3"/>
    <circle cx="280" cy="320" r="3"/><circle cx="330" cy="290" r="3"/><circle cx="380" cy="330" r="3"/>
    <circle cx="430" cy="280" r="3"/><circle cx="480" cy="310" r="3"/><circle cx="530" cy="270" r="3"/>

    <path d="M800,210 Q900,110 1080,140"/>
    <path d="M800,210 Q950,260 1180,240"/>
    <path d="M800,210 Q640,300 470,300"/>
    <path d="M800,210 Q560,180 340,190"/>
    <path d="M800,210 Q1000,300 1250,320"/>
  </g>

  <!-- office nodes -->
  <g>
    <circle cx="500" cy="150" r="5" fill="#c9962e"/>
    <circle cx="500" cy="150" r="10" fill="none" stroke="#c9962e" stroke-width="1" stroke-opacity="0.5"/>

    <circle cx="1080" cy="140" r="5" fill="#c9962e"/>
    <circle cx="1080" cy="140" r="10" fill="none" stroke="#c9962e" stroke-width="1" stroke-opacity="0.5"/>

    <circle cx="1180" cy="240" r="5" fill="#c9962e"/>

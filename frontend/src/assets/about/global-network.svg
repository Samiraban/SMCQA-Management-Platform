  <circle cx="800" cy="210" r="7" fill="#ffffff"/>
  <circle cx="800" cy="210" r="14" fill="none" stroke="#c9962e" stroke-width="2"/>
  <circle cx="800" cy="210" r="22" fill="none" stroke="#c9962e" stroke-width="1" stroke-opacity="0.45"/>

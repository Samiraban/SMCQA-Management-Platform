    <circle cx="1180" cy="320" r="3"/><circle cx="1230" cy="290" r="3"/><circle cx="1280" cy="330" r="3"/>
    <circle cx="1330" cy="280" r="3"/><circle cx="1380" cy="310" r="3"/><circle cx="1430" cy="270" r="3"/>
